# Foot terminal config — migrated from gnome-terminal + tmux setup

[main]
font=monospace:size=7
dpi-aware=yes
pad=4x4

# Shell — match your tmux default
shell=/bin/bash

# Window
initial-window-size-chars=120x40
initial-window-mode=windowed
title=foot
locked-title=no

[scrollback]
# Match tmux history-limit 25000
lines=25000
indicator-position=relative
indicator-format=line

[cursor]
style=block
blink=no

[mouse]
hide-when-typing=yes

[colors]
# Dark theme matching your tmux color scheme
# (dark gray background, light text)
background=2a2a3a
foreground=e4e4e4

# Normal colors
regular0=080808  # black (your colour_1)
regular1=d70000  # red (your colour_16)
regular2=5fff00  # green (your colour_11)
regular3=ffff00  # yellow (your colour_5)
regular4=00afff  # blue (your colour_4)
regular5=ff00af  # magenta (your colour_10)
regular6=00afaf  # cyan
regular7=e4e4e4  # white (your colour_7)

# Bright colors
bright0=303030   # bright black (your colour_2)
bright1=ff5f5f   # bright red
bright2=87ff5f   # bright green
bright3=ffff87   # bright yellow
bright4=5fafff   # bright blue
bright5=ff5faf   # bright magenta
bright6=5fd7d7   # bright cyan
bright7=ffffff   # bright white

[key-bindings]
clipboard-paste=Control+v Control+Shift+v

[csd]
preferred=server

[tweak]
# Enable BiDi/RTL support
grapheme-shaping=yes
